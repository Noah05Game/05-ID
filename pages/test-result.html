<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>05 ID — Authentication Result</title>

<link
    rel="icon"
    type="image/png"
    href="../assets/05-id-logo.png"
>

<link
    rel="stylesheet"
    href="../css/style.css"
>
```

</head>

<body>

```
<main class="auth-page">

    <section class="auth-card">

        <div class="auth-header">

            <img
                src="../assets/05-id-logo.png"
                alt="05 ID"
                class="auth-logo"
            >

            <h1 id="resultTitle">
                Completing sign in
            </h1>

            <p id="resultMessage">
                Verifying your 05 ID authentication...
            </p>

        </div>


        <div
            id="resultDetails"
            class="form-message"
            style="display: none;"
        ></div>


        <button
            type="button"
            id="backButton"
            class="auth-button"
            style="display: none;"
            onclick="window.location.href='test-app.html'"
        >
            Back to test app
        </button>

    </section>

</main>


<!--
    IMPORTANT:
    config.js MUST load before test-result.js
    because test-result.js uses
    SUPABASE_PUBLISHABLE_KEY.
-->

<script src="../js/config.js"></script>

<!-- Load test-result.js ONCE -->
<script src="../js/test-result.js"></script>
```

</body>

</html>
