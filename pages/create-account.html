<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — 05 ID</title>

<link
    rel="icon"
    type="image/png"
    href="../assets/05-id-logo.png"
>

    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <img
                    src="../assets/05-id-logo.png"
                    alt="05 ID"
                    class="auth-logo"
                >

                <h1>Create your account</h1>

                <p>
                    Create a 05 ID to access services from The05Company.
                </p>

            </div>


            <form id="createAccountForm">

                <div class="form-group">

                    <label for="fullName">
                        Full name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Your name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div
                    id="formMessage"
                    class="form-message"
                ></div>


                <button
                    type="submit"
                    id="createAccountButton"
                    class="auth-button"
                >
                    Create account
                </button>

            </form>


            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Sign in
                </a>

            </div>

        </section>

    </main>


    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/app.js"></script>

</body>
</html>
