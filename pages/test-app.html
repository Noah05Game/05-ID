<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>05 ID Test App</title>

    <link
        rel="icon"
        type="image/png"
        href="../assets/05-id-logo.png"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <img
                    src="../assets/05-id-logo.png"
                    alt="05 ID"
                    class="auth-logo"
                >

                <h1>
                    05 ID Test App
                </h1>

                <p>
                    Test the 05 ID OAuth system.
                </p>

            </div>


            <div
                id="statusMessage"
                class="form-message"
            >
                Ready to connect.
            </div>


            <button
                type="button"
                id="loginButton"
                class="auth-button"
            >
                Continue with 05 ID
            </button>


            <div class="auth-footer">

                <span>
                    OAuth client:
                </span>

                <strong>
                    05id_test_app
                </strong>

            </div>

        </section>

    </main>


    <script src="../js/test-app.js"></script>

</body>

</html>
