<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>05 ID Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
            color: #111111;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
            font-weight: 700;
        }

        p {
            margin: 0 0 28px;
            color: #666;
            line-height: 1.5;
        }

        .login-button {
            width: 100%;
            height: 52px;

            border: 1px solid #d9d9d9;
            border-radius: 10px;

            background: #ffffff;
            color: #111111;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                transform 0.15s ease;
        }

        .login-button:hover {
            background: #f7f7f7;
            border-color: #c8c8c8;
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .status {
            display: none;

            padding: 22px;

            border-radius: 12px;

            background: #f7f7f7;
        }

        .status-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .status h2 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .status p {
            margin: 0;
        }

        .success {
            display: block;
        }

        .error {
            display: block;
        }

        .error h2 {
            color: #d93025;
        }

        .loading {
            display: block;
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- LOGIN -->
        <section id="loginSection">

            <h1>Test App</h1>

            <p>
                Sign in to this test application using your 05 ID.
            </p>

            <button
                id="loginButton"
                class="login-button"
            >
                Login with 05 ID
            </button>

        </section>


        <!-- STATUS -->
        <section
            id="statusSection"
            class="status"
        >

            <div
                id="statusIcon"
                class="status-icon"
            >
                ⏳
            </div>

            <h2 id="statusTitle">
                Checking authentication...
            </h2>

            <p id="statusMessage">
                Please wait.
            </p>

        </section>

    </main>


    <script>

        /*
        ========================================
        CONFIGURATION
        ========================================
        */

        const AUTHORIZATION_PAGE =
            "authorize.html";


        /*
        ========================================
        ELEMENTS
        ========================================
        */

        const loginSection =
            document.getElementById(
                "loginSection"
            );

        const statusSection =
            document.getElementById(
                "statusSection"
            );

        const statusIcon =
            document.getElementById(
                "statusIcon"
            );

        const statusTitle =
            document.getElementById(
                "statusTitle"
            );

        const statusMessage =
            document.getElementById(
                "statusMessage"
            );

        const loginButton =
            document.getElementById(
                "loginButton"
            );


        /*
        ========================================
        LOGIN BUTTON
        ========================================
        */

        loginButton.addEventListener(
            "click",
            () => {

                window.location.href =
                    AUTHORIZATION_PAGE +
                    "?redirect=" +
                    encodeURIComponent(
                        window.location.href
                    );

            }
        );


        /*
        ========================================
        CHECK AUTHORIZATION RESULT
        ========================================
        */

        function checkAuthorizationResult() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const status =
                params.get("status");

            const error =
                params.get("error");

            const errorDescription =
                params.get(
                    "error_description"
                );


            /*
            ------------------------------------
            NO RESULT
            ------------------------------------
            */

            if (!status && !error) {
                return;
            }


            /*
            ------------------------------------
            SHOW STATUS
            ------------------------------------
            */

            loginSection.style.display =
                "none";

            statusSection.style.display =
                "block";


            /*
            ------------------------------------
            SUCCESS
            ------------------------------------
            */

            if (status === "success") {

                statusIcon.textContent =
                    "✓";

                statusTitle.textContent =
                    "Authentication successful";

                statusMessage.textContent =
                    "Your 05 ID authorization was completed successfully.";

                return;
            }


            /*
            ------------------------------------
            FAILURE
            ------------------------------------
            */

            statusIcon.textContent =
                "✕";

            statusTitle.textContent =
                "Authentication failed";

            statusMessage.textContent =
                errorDescription ||
                error ||
                "Something went wrong while authenticating with 05 ID.";
        }


        /*
        ========================================
        RUN
        ========================================
        */

        checkAuthorizationResult();

    </script>

</body>
</html>
