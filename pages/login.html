<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In — 05 ID</title>

<link
    rel="icon"
    type="image/png"
    href="../assets/05-id-logo.png"
>

    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <img
                    src="../assets/05-id-logo.png"
                    alt="05 ID"
                    class="auth-logo"
                >

                <h1>Welcome back</h1>

                <p>
                    Sign in with your 05 ID to continue.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="formMessage"
                    class="form-message"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                    class="auth-button"
                >
                    Sign in
                </button>

            </form>


            <div class="auth-footer">

                <span>
                    Don't have an account?
                </span>

                <a href="create-account.html">
                    Create account
                </a>

            </div>

        </section>

    </main>


    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/app.js"></script>

</body>
</html>
