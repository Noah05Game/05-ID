<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>05 ID</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/05-id-logo.png"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(255, 255, 255, 0.06),
                    transparent 35%
                ),
                #050505;

            color: #ffffff;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }


        /* ========================================
           PAGE
        ======================================== */

        .connection-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }


        /* ========================================
           CARD
        ======================================== */

        .connection-card {
            width: 100%;
            max-width: 460px;

            padding: 48px;

            text-align: center;

            background:
                rgba(13, 13, 13, 0.95);

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 22px;

            box-shadow:
                0 25px 80px
                rgba(0, 0, 0, 0.55);

            animation:
                card-in
                0.5s ease both;
        }


        @keyframes card-in {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ========================================
           LOGO
        ======================================== */

        .connection-logo {
            width: 64px;
            height: 64px;

            margin:
                0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .connection-logo img {
            width: 64px;
            height: 64px;

            object-fit: contain;
        }


        /* ========================================
           CONTENT
        ======================================== */

        .eyebrow {
            margin: 0 0 10px;

            color:
                rgba(255, 255, 255, 0.45);

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 0.12em;

            text-transform: uppercase;
        }

        .connection-content h1 {
            margin: 0 0 12px;

            color: #ffffff;

            font-size: 26px;
            font-weight: 600;

            letter-spacing: -0.03em;
        }

        .connection-content p {
            margin: 0;

            color:
                rgba(255, 255, 255, 0.55);

            font-size: 15px;

            line-height: 1.6;
        }


        /* ========================================
           LOADING
        ======================================== */

        .loading {
            width: 24px;
            height: 24px;

            margin:
                28px auto 0;

            border-radius: 50%;

            border:
                2px solid
                rgba(255, 255, 255, 0.12);

            border-top-color:
                rgba(255, 255, 255, 0.9);

            animation:
                spin
                0.8s linear infinite;
        }


        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* ========================================
           COUNTDOWN
        ======================================== */

        .countdown {
            margin-top: 18px;

            color:
                rgba(255, 255, 255, 0.3);

            font-size: 12px;

            font-variant-numeric:
                tabular-nums;
        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 520px) {

            .connection-page {
                padding: 16px;
            }

            .connection-card {
                padding: 34px 24px;

                border-radius: 18px;
            }

        }

    </style>

</head>


<body>


    <main class="connection-page">


        <section class="connection-card">


            <div class="connection-logo">

                <img
                    src="assets/05-id-logo.png"
                    alt="05 ID"
                >

            </div>


            <div class="connection-content">

            

                <h1>
                    Preparing your sign in
                </h1>

                <p>
                    Connecting you to 05 ID...
                </p>

                <div
                    class="loading"
                    aria-hidden="true"
                ></div>

                <div
                    class="countdown"
                    id="countdown"
                >
                    Redirecting in 3 seconds
                </div>

            </div>


        </section>


    </main>


    <script>

        let seconds = 3;

        const countdown =
            document.getElementById("countdown");

        const redirectUrl =
            "pages/login.html";


        const timer =
            setInterval(() => {

                seconds--;

                if (seconds > 0) {

                    countdown.textContent =
                        `Redirecting in ${seconds} second${seconds === 1 ? "" : "s"}`;

                } else {

                    countdown.textContent =
                        "Redirecting...";

                    clearInterval(timer);

                    window.location.href =
                        redirectUrl;

                }

            }, 1000);

    </script>


</body>

</html>
